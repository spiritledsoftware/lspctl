[package]
name = "lspctl"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
default-run = "lspctl"
description = "Agent-facing command-line client for Language Server Protocol servers"
repository = "https://github.com/spiritledsoftware/lspctl"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
fake-server = []

[dependencies]
atomic-write-file = "0.3"
async-lsp = { version = "0.2.4", default-features = false }
cap-fs-ext = "4"
cap-std = "4"
clap = { version = "4.5", features = ["string"] }
directories = "6"
dunce = "1"
hex = "0.4"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
similar = "2.7"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
tower-service = "0.3"
url = "2"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "lspctl-fake-server"
path = "test_support/fake_lsp_server.rs"
required-features = ["fake-server"]
